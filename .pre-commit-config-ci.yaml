# Simplified pre-commit configuration for CI
# This is a minimal version to avoid dependency issues in CI

repos:
  # Basic hooks that don't require complex dependencies
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=10240"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Python code formatting with black (simplified)
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=88", "--target-version=py311"]

  # Python import sorting with isort (simplified)
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=88"]

  # Basic Python linting (without extra dependencies)
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503,E501"]

  # Type checking with mypy (simplified)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.0
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--show-error-codes"]
        exclude: ^(tests/|frontend/)

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-ll"]
        exclude: ^(tests/|frontend/)

# Default configuration
default_language_version:
  python: python3

# Fail fast on first error
fail_fast: false

# Minimum pre-commit version
minimum_pre_commit_version: 2.17.0
