name: CI/CD Pipeline

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install basic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings
          pip install pytest pytest-asyncio pytest-cov

      - name: Check Python syntax
        run: |
          echo "Checking Python syntax..."
          python3 -m py_compile src/main.py && echo "✓ src/main.py syntax OK"
          python3 -m py_compile src/tasks.py && echo "✓ src/tasks.py syntax OK"
          python3 -m py_compile config/settings.py && echo "✓ config/settings.py syntax OK"
          python3 -m py_compile services/audio_processor.py && echo "✓ services/audio_processor.py syntax OK"
          python3 -m py_compile services/user_manager.py && echo "✓ services/user_manager.py syntax OK"
          python3 -m py_compile services/payment_service.py && echo "✓ services/payment_service.py syntax OK"
          echo "All Python files have valid syntax!"

      - name: Run basic tests
        run: |
          python -m pytest tests/ -v

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml
