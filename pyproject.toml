[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereobrother-bot"
version = "1.0.0"
description = "Бот для ИИ-обработки и реставрации аудио"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "StereoBrother Team", email = "support@stereobrother.com"}
]
maintainers = [
    {name = "StereoBrother Team", email = "support@stereobrother.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
keywords = ["audio", "ai", "processing", "restoration", "music", "podcast"]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "aioredis==2.0.1",
    "redis==5.0.1",
    "librosa==0.10.1",
    "soundfile==0.12.1",
    "numpy==1.24.3",
    "scipy==1.11.4",
    "pydub==0.25.1",
    "audioread==3.0.0",
    "torch==2.1.0",
    "torchaudio==2.1.0",
    "demucs==4.0.0",
    "spleeter==2.4.0",
    "openunmix==1.2.1",
    "boto3==1.34.0",
    "minio==7.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "yookassa==2.4.0",
    "cloudpayments==1.0.0",
    "aiohttp==3.9.1",
    "aiosmtplib==2.0.1",
    "python-telegram-bot==20.6",
    "celery==5.3.4",
    "flower==2.0.1",
    "prometheus-client==0.19.0",
    "structlog==23.2.0",
    "sentry-sdk==1.38.0",
    "python-dotenv==1.0.0",
    "python-dateutil==2.8.2",
    "pytz==2023.3",
    "tzdata==2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "httpx==0.25.1",
    "black==23.11.0",
    "isort==5.12.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "pre-commit==3.5.0",
]
docs = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.3",
    "mkdocstrings[python]==0.24.0",
]
gpu = [
    "torch==2.1.0+cu118; platform_system != 'Darwin'",
]

[project.urls]
Homepage = "https://github.com/yourusername/stereobrother_bot"
Documentation = "https://docs.stereobrother.com"
Repository = "https://github.com/yourusername/stereobrother_bot"
Changelog = "https://github.com/yourusername/stereobrother_bot/blob/main/CHANGELOG.md"
Issues = "https://github.com/yourusername/stereobrother_bot/issues"
Discussions = "https://github.com/yourusername/stereobrother_bot/discussions"

[project.scripts]
stereobrother = "src.main:app"
stereobrother-worker = "src.tasks:celery_app"
stereobrother-cli = "run.py:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "services*", "models*", "utils*"]
exclude = ["tests*", "docs*", "frontend*", "db*", "storage*", "temp*", "logs*", "models*"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | frontend
  | storage
  | temp
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "soundfile.*",
    "pydub.*",
    "torch.*",
    "torchaudio.*",
    "demucs.*",
    "spleeter.*",
    "openunmix.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[project.entry-points."console_scripts"]
stereobrother-run = "run:main"
